name: Publicar Bounce Tales en GitHub Pages

on:
  push:
    branches: [web]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bounce-tales-pages
  cancel-in-progress: false

jobs:
  validar:
    if: github.ref == 'refs/heads/web'
    name: Comprobar juego completo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Instalar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Comprobar sintaxis, niveles, fisicas y arranque
        run: |
          npm run verify
          node --check remaster/remaster.js
          node --check remaster/scenery.js
          node --check remaster/materials.js
          node --check remaster/texture-hd.js
      - name: Comprobar compilacion del generador de texturas
        run: python3 -m py_compile tools/build_hd_textures.py tools/build_hd_scenery.py
      - name: Comprobar archivos de la version web
        shell: bash
        run: |
          set -euo pipefail
          for path in index.html game.js style.css sw.js manifest.webmanifest .nojekyll favicon.png icon-192.png icon-512.png apple-touch-icon.png src/rlef-reader.js src/image-map.json src/sprite-atlas.json assets/original/aa.png assets/original/bf assets/audio/title.ogg; do
            test -f "$path" || { echo "::error::Falta: $path"; exit 1; }
          done
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('manifest.webmanifest','utf8'));if(m.start_url!=='./'||m.scope!=='./')process.exit(1)"
          echo 'Archivos y rutas relativos verificados.'

  publicar:
    name: Publicar web jugable
    needs: validar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: bounce-tales-web
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Preparar web estatica
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public
          cp index.html game.js style.css sw.js manifest.webmanifest .nojekyll public/
          cp favicon.png icon-192.png icon-512.png apple-touch-icon.png bounce-tales-web-preview.png public/
          cp -a src assets remaster public/
          test -f public/index.html && test -f public/assets/original/aa.png && test -f public/remaster/remaster.js && test -f public/remaster/remaster.css && test -f public/remaster/texture-hd.js
      - name: Instalar Python para el procesado HD
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generar todas las texturas HD del juego
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow numpy
          python tools/build_hd_textures.py --output public/remaster/assets/hd --scale 4
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('public/remaster/assets/hd')
          m=json.loads((root/'manifest.json').read_text())
          assert m['version']==4 and m['scale']==4
          assert m['spriteCount']==326 and m['originalAtlases']==46
          assert len(m['sprites'])==326 and len(m['pages'])>=1
          assert sum(m['policyCounts'].values())==326
          assert all(s['sampling'] in ('pixel','smooth') for s in m['sprites'].values())
          assert all((root/name).is_file() for name in m['pages'])
          print(f"Validated {len(m['sprites'])} clean sprites in {len(m['pages'])} pages")
          PY
          python tools/validate_hd_textures.py --output public/remaster/assets/hd
          # Lightweight 2x sprites for small devices; validate individually.
          python tools/build_hd_textures.py --output public/remaster/assets/mobile --scale 2
          python tools/validate_hd_textures.py --output public/remaster/assets/mobile --scale 2
      - name: Generar los cuatro fondos retro cartoon HD
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_hd_scenery.py --output public/remaster/assets/scenery
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('public/remaster/assets/scenery')
          m=json.loads((p/'manifest.json').read_text())
          assert m['version']==2 and m['style']=='cartoon-retro-hd' and m['width']==1200 and m['height']==1600
          assert set(m['biomes'])=={'forest','lagoon','twilight','sunset'}
          assert all((p/f).is_file() and (p/f).stat().st_size>1000 for f in m['biomes'].values())
          print('Validated all 4 hand-painted retro cartoon biomes')
          PY
      # Requiere habilitar Settings > Pages > Source: GitHub Actions
      # El GITHUB_TOKEN no tiene permisos para crear el sitio Pages.
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir archivos web
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
